apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: linearticketbindings.linear.cerebral.work
spec:
  group: linear.cerebral.work
  scope: Namespaced
  names:
    plural: linearticketbindings
    singular: linearticketbinding
    kind: LinearTicketBinding
    shortNames:
      - lticket
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - ticket
                - resource
                - rules
              properties:
                ticket:
                  type: string
                apply:
                  type: boolean
                  default: false
                resource:
                  type: object
                  required:
                    - apiVersion
                    - kind
                    - name
                    - namespace
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                rules:
                  type: array
                  items:
                    type: object
                    required:
                      - when
                      - then
                    properties:
                      when:
                        type: string
                      then:
                        type: string
                        enum:
                          - close
                          - comment
                          - update
                      state:
                        type: string
                      comment:
                        type: string
            status:
              type: object
              properties:
                lastEvent:
                  type: string
                ticketState:
                  type: string
                plannedAction:
                  type: string
                applied:
                  type: boolean
                shippingComment:
                  type: string
                lastSync:
                  type: string
