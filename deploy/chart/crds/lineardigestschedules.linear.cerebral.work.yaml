apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lineardigestschedules.linear.cerebral.work
spec:
  group: linear.cerebral.work
  scope: Namespaced
  names:
    plural: lineardigestschedules
    singular: lineardigestschedule
    kind: LinearDigestSchedule
    shortNames:
      - ldigest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - schedule
                - team
                - since
                - output
              properties:
                schedule:
                  type: string
                team:
                  type: string
                since:
                  type: string
                json:
                  type: boolean
                  default: true
                output:
                  type: object
                  required:
                    - configMap
                  properties:
                    configMap:
                      type: string
                    namespace:
                      type: string
            status:
              type: object
              properties:
                lastRun:
                  type: string
                lastConfigMapVersion:
                  type: string
                issueCount:
                  type: integer
