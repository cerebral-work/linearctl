apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: linearprojects.linear.cerebral.work
spec:
  group: linear.cerebral.work
  scope: Cluster
  names:
    plural: linearprojects
    singular: linearproject
    kind: LinearProject
    shortNames:
      - lproj
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - projectRef
                - team
              properties:
                projectRef:
                  type: string
                team:
                  type: string
                syncInterval:
                  type: string
                  default: 5m
            status:
              type: object
              properties:
                triageCount:
                  type: integer
                staleCount:
                  type: integer
                lastSync:
                  type: string
                milestones:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
