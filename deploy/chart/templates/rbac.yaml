{{- /*
ServiceAccount only (PR #120, chart 0.2.0).

The operator daemon is a single-actor Deployment. It does NOT need leader
election (no Role/RoleBinding for coordination.k8s.io/leases), nor any
in-cluster Kubernetes API access — it polls the Cloudflare Queue and calls the
Linear + LLM APIs over HTTP. automountServiceAccountToken is false so no API
credential is mounted into the pod.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sa
  labels:
    app.kubernetes.io/name: linearctl
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
automountServiceAccountToken: false
