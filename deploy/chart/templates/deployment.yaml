{{- /*
Operator Deployment (PR #120, chart 0.2.0).

Single-actor Deployment. No Service/Ingress — the daemon is not addressable
from outside its pod (Unix-socket + exec probes only). Secrets are env refs to
ExternalSecret-rendered Kubernetes Secrets (OpenBao-backed); no secret values
in the chart. automountServiceAccountToken: false (no in-cluster API access).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    app.kubernetes.io/name: linearctl
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: linearctl
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linearctl
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linearctl-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: {{ .Values.deployment.args | toJson }}
          env:
            # 1. Linear OAuth app creds (client_credentials grant at startup).
            - name: LINEAR_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.linearOauthClientId.secretKeyRef.name }}
                  key: {{ .Values.env.linearOauthClientId.secretKeyRef.key }}
            - name: LINEAR_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.linearOauthClientSecret.secretKeyRef.name }}
                  key: {{ .Values.env.linearOauthClientSecret.secretKeyRef.key }}
            # 2. Cloudflare Queue consumer.
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.cfAccountId.secretKeyRef.name }}
                  key: {{ .Values.env.cfAccountId.secretKeyRef.key }}
            - name: CF_QUEUE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.cfQueueId.secretKeyRef.name }}
                  key: {{ .Values.env.cfQueueId.secretKeyRef.key }}
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.cfApiToken.secretKeyRef.name }}
                  key: {{ .Values.env.cfApiToken.secretKeyRef.key }}
            # 2b. Queue HMAC verification (optional) — when set, the poller
            # verifies every queue message as a signed envelope (forgery
            # defense: CF Queues tokens may scope account-wide, so queue
            # write access alone must not reach the event loop). Rollout
            # sequencing and the warn/enforce migration mode: see values.yaml.
            {{- with .Values.env.queueHmacKey }}
            - name: LINEARCTL_QUEUE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
            {{- end }}
            {{- with .Values.env.queueHmacKeyPrev }}
            - name: LINEARCTL_QUEUE_HMAC_KEY_PREV
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
            {{- end }}
            {{- with .Values.env.queueHmacMode }}
            - name: LINEARCTL_QUEUE_HMAC_MODE
              value: {{ . | quote }}
            {{- end }}
            # 3. LLM gateway — in-cluster LiteLLM proxy.
            - name: LLM_BASE_URL
              value: {{ .Values.env.llmBaseUrl.value | quote }}
            - name: LLM_MODEL
              value: {{ .Values.env.llmModel.value | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.llmApiKey.secretKeyRef.name }}
                  key: {{ .Values.env.llmApiKey.secretKeyRef.key }}
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Exec probes — the daemon serves /healthz + /readyz on its Unix
          # socket; the binary probes its own socket. No HTTP port exposed.
          #   liveness  → --health (GET /healthz — process alive)
          #   readiness → --check   (GET /readyz  — able to consume)
          livenessProbe:
            exec:
              command: ["/app/linearctl", "operator", "--health"]
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            exec:
              command: ["/app/linearctl", "operator", "--check"]
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /home/nonroot/.local/state/linearctl
            # HOLD switch: the daemon checks /etc/linearctl/hold/HOLD each
            # tick. The ConfigMap is DELIBERATELY NOT chart-managed: a
            # chart-rendered CM would be reverted to empty by any sync or
            # self-heal, silently releasing an engaged hold mid-incident.
            # Operator-created objects are untracked by GitOps and survive.
            #   engage:  kubectl -n <ns> create configmap {{ .Release.Name }}-hold --from-literal=HOLD=1
            #   release: kubectl -n <ns> delete configmap {{ .Release.Name }}-hold
            # Kubelet propagates the mount within ~a minute of either.
            - name: hold
              mountPath: /etc/linearctl/hold
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          emptyDir: {}
        - name: hold
          configMap:
            name: {{ .Release.Name }}-hold
            optional: true
