apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    app.kubernetes.io/name: linearctl
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: linearctl
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linearctl
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/loop-recipes: {{ include (print $.Template.BasePath "/loop-recipes-cm.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linearctl-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: {{ .Values.deployment.args | toJson }}
          env:
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.cfAccountId.secretKeyRef.name }}
                  key: {{ .Values.env.cfAccountId.secretKeyRef.key }}
            - name: CF_QUEUE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.cfQueueId.secretKeyRef.name }}
                  key: {{ .Values.env.cfQueueId.secretKeyRef.key }}
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.cfApiToken.secretKeyRef.name }}
                  key: {{ .Values.env.cfApiToken.secretKeyRef.key }}
            - name: LLM_BASE_URL
              value: {{ .Values.env.llmBaseUrl.value | quote }}
            - name: LLM_MODEL
              value: {{ .Values.env.llmModel.value | quote }}
            - name: LINEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.linearApiKey.secretKeyRef.name }}
                  key: {{ .Values.env.linearApiKey.secretKeyRef.key }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Exec probes — `linearctl operator --check` hits the daemon's /readyz
          # via the Unix socket. Liveness uses the process-is-alive /healthz.
          livenessProbe:
            exec:
              command: ["/app/linearctl", "operator", "--check"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/app/linearctl", "operator", "--check"]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: loop-recipes
              mountPath: /app/.linearctl/loop-recipes
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /home/nonroot/.local/state/linearctl
      volumes:
        - name: loop-recipes
          configMap:
            name: {{ .Values.loopRecipes.configMapName }}
        - name: tmp
          emptyDir: {}
        - name: state
          emptyDir: {}
