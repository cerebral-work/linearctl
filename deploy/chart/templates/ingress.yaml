{{- if .Values.webhook.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-webhook
  labels:
    app.kubernetes.io/name: linearctl
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Sign and verify Linear webhook payloads at the edge.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Linear sends X-Linear-Signature (HMAC-SHA256 of the body).
      # The opera verifies this against LINEARCTL_WEBHOOK_SECRET.
spec:
  rules:
    - host: {{ .Values.webhook.host | default (printf "%s-webhook.%s" .Release.Name .Release.Namespace) }}
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
