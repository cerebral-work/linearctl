# linearctl Helm chart values
# The operator daemon: long-running, polls the CF Queue, serves linearctl watch,
# and boots maintainer-agent roles on cadence (CER-1149 + CER-1188).

image:
  repository: ghcr.io/cerebral-work/linearctl
  pullPolicy: IfNotPresent
  tag: "latest"  # Digest-pinned in production via ArgoCD

# Deploy the operator daemon (not the old pull/funnel reconciler).
deployment:
  replicas: 1  # Single-actor — the app-actor token is the identity, not a fleet
  args:
    - "operator"
    - "--role"
    - "intake-triage"
    - "--role"
    - "grooming"
    # "--json" suppresses the human banner (stdout is clean for logs)

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Environment — the operator daemon needs CF Queue access + LLM gateway.
# Secrets resolved from OpenBao (primary) via ExternalSecret at runtime.
# Never put secret values in values.yaml.
env:
  # Cloudflare Queue (the operator polls this for AgentSessionEvents)
  cfAccountId:
    secretKeyRef:
      name: linearctl-cf-queue
      key: account-id
  cfQueueId:
    secretKeyRef:
      name: linearctl-cf-queue
      key: queue-id
  cfApiToken:
    secretKeyRef:
      name: linearctl-cf-queue
      key: api-token
  # LLM gateway (tailnet — the daemon calls http://llm/v1 for driveAgentLoop)
  llmBaseUrl:
    value: "http://llm/v1"
  llmModel:
    value: "llm/glm-5.2"
  # Linear API key (for the roles' Linear calls — triage, stale, comment)
  linearApiKey:
    secretKeyRef:
      name: linearctl-linear-api-key
      key: api-key

# Health — the operator serves /healthz + /readyz on its Unix socket.
# K8s probes use an exec sidecar: `linearctl operator --check` hits /readyz.
# The container also exposes a simple HTTP /healthz for kubelet probes.
service:
  type: ClusterIP
  port: 8080

health:
  liveness: /healthz
  readiness: /readyz
  # The operator daemon listens on a Unix socket for /readyz.
  # For K8s HTTP probes, the container runs a tiny health-proxy alongside.
  # Alternatively, use exec probes: `linearctl operator --check`

# Loop recipes — mounted from the repo's .linearctl/loop-recipes/ as a ConfigMap.
loopRecipes:
  configMapName: linearctl-loop-recipes
  lintOnStartup: true
