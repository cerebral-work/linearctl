# linearctl operator daemon — Helm chart values (PR #120, chart 0.2.0).
#
# The operator is a single-actor Deployment: no Service, no Ingress, no leader-
# election Role/Binding, no metrics ServiceMonitor, no loop-recipe ConfigMap.
# It serves linearctl watch over a Unix socket + uses exec probes against its
# own /healthz + /readyz. Secrets are rendered from OpenBao by ExternalSecret
# (never committed as values); only the secret *names* + *keys* live here.

image:
  # Harbor is the estate registry (NOT GHCR). The tag placeholder is replaced
  # at deploy time by ArgoCD with `git-<12-char SHA>`; never `latest`.
  repository: harbor.unsigned.gg/platform/linearctl
  pullPolicy: IfNotPresent
  tag: "git-000000000000"  # placeholder — ArgoCD overrides with the exact source SHA tag

# imagePullSecrets — the daemon pulls from Harbor via the platform-pull
# dockerconfigjson from OpenBao (ExternalSecret `linearctl-harbor-pull`).
imagePullSecrets:
  - name: linearctl-harbor-pull

# Deploy the operator daemon (single-actor — the app-actor token is the
# identity, not a fleet).
deployment:
  replicas: 1
  args:
    - "operator"
    - "--role"
    - "intake-triage"
    - "--role"
    - "grooming"
    - "--json"  # suppresses the human banner; stdout stays clean for logs

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Runtime secrets — each is a Kubernetes Secret created by an ExternalSecret
# from OpenBao. Only the secret *name* + *key* live here; never the values.
# The daemon mints its own app-actor Linear token at startup from the OAuth
# client creds (client_credentials grant) — there is no personal LINEAR_API_KEY
# and no `op` binary in the pod.
env:
  # 1. Linear OAuth app creds (client_credentials) — the daemon's identity.
  #    ExternalSecret `linearctl-oauth` from OpenBao.
  linearOauthClientId:
    secretKeyRef:
      name: linearctl-oauth
      key: client-id
  linearOauthClientSecret:
    secretKeyRef:
      name: linearctl-oauth
      key: client-secret
  # 2. Cloudflare Queue consumer — polls `linear-agent-events` for AgentSessionEvents.
  #    ExternalSecret `linearctl-cf-queue` from OpenBao.
  cfAccountId:
    secretKeyRef:
      name: linearctl-cf-queue
      key: account-id
  cfQueueId:
    secretKeyRef:
      name: linearctl-cf-queue
      key: queue-id
  cfApiToken:
    secretKeyRef:
      name: linearctl-cf-queue
      key: api-token
  # 3. LLM gateway — the in-cluster LiteLLM proxy (namespace llm, port 4000).
  #    ExternalSecret `linearctl-llm` from OpenBao; base/model are chart values.
  llmBaseUrl:
    value: "http://llm.llm.svc.cluster.local:4000/v1"
  llmModel:
    value: "glm-5.2"
  llmApiKey:
    secretKeyRef:
      name: linearctl-llm
      key: api-key

# Health — exec probes against the daemon's own Unix socket:
#   liveness  → `linearctl operator --health` (GET /healthz — process alive)
#   readiness → `linearctl operator --check`   (GET /readyz  — able to consume)
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5

# NetworkPolicy — egress only (DNS, HTTPS to Cloudflare, namespace llm:4000).
# Zero ingress: the daemon is not addressable from outside the pod.
networkPolicy:
  enabled: true
  llmNamespace: llm
  llmPort: 4000

# PDB — keep the single replica from being drained unsafely (minAvailable: 1).
podDisruptionBudget:
  enabled: true
  minAvailable: 1
