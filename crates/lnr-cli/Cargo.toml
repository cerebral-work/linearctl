[package]
name = "lnr-cli"
description = "Command line interface for lnr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lnr"
path = "src/main.rs"

[dependencies]
lnr-domain = { path = "../lnr-domain" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# cargo-machete 0.9.1 finds no use of these (2026-10-14, xtask contract v1 gate).
# Listed, not removed: dropping dependencies belongs in its own change. Remove
# them there and delete this list.
ignored = ["anyhow", "clap", "tracing"]
