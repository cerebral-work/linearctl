name: approve-auto-render-ci

# CI runs on GITHUB_TOKEN-created auto-render PRs trigger the action_required
# gate (first-time contributor approval). The GITHUB_TOKEN can't self-approve
# from within the same workflow. This workflow fires when the velocity workflow
# completes, then finds and approves any pending CI runs on auto-render/*
# branches, unblocking auto-merge.
#
# Evolution: eventually move to a PAT (bot account) that creates the PR — PAT
# PRs don't trigger the action_required gate. This is the GITHUB_TOKEN-only
# workaround (no secrets to provision).

on:
  workflow_run:
    workflows: ["gaze-upon velocity"]
    types: [completed]

permissions:
  actions: write
  pull-requests: write

jobs:
  approve:
    name: Approve CI on auto-render PRs
    runs-on: ubuntu-latest
    steps:
      - name: Find and approve pending CI runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Find CI workflow runs in action_required status on auto-render branches
          for run_id in $(gh run list --workflow ci.yml --status action_required --limit 10 --json databaseId,headBranch --jq '.[] | select(.headBranch | startswith("auto-render/")) | .databaseId'); do
            echo "Approving CI run $run_id..."
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/approve" 2>&1 \
              && echo "  approved" \
              || echo "  failed (may already be approved)"
          done
