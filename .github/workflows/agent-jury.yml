# Agent jury: a thin caller of the shared workflow in cerebral-work/.github.
# Pinned to a release sha (v1.1.0). The shared workflow builds the gateway
# request as an array, never an eval'd string, so PR text cannot execute
# on the runner (the defect in the previous vendored copy, 2026-10-05).
name: Agent Jury

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  jury:
    uses: cerebral-work/.github/.github/workflows/agent-jury.yml@c6567996e98d6c2228262646749821ce4f6522cd # v1.1.0
    secrets:
      AGENT_JURY_API_KEY: ${{ secrets.AGENT_JURY_API_KEY }}
