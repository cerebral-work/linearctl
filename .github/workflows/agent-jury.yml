name: Agent Jury

# Thin caller. THE implementation is shared across the estate and lives in
# cerebral-work/.github — read that file for the reasoning behind the
# three-tier split, the diff budget, and the verdict whitelist.
#
# DO NOT fork this back into a local copy. Before 2026-08-16 this workflow was
# copy-pasted into 39 repositories and had drifted into 11 distinct versions
# across two filename families, so a fix landed in one repo reached none of the
# others. That is exactly what this indirection removes.
#
# The gateway credential comes from `secrets: inherit`:
#   public repos  — the org-level AGENT_JURY_API_KEY resolves.
#   private repos — it does NOT (GitHub Free plan), so those keep a repo-level
#                   secret until the ARC runners carry the key themselves.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Job name `jury` is deliberate: GitHub prefixes reusable-workflow check
  # names with it, giving `jury / GLM-5.2 code review`.
  jury:
    uses: cerebral-work/.github/.github/workflows/agent-jury.yml@v1
    secrets: inherit
    with:
      # MUST be `reverie`, not the `self-hosted` default. The cerebral-work
      # `self-hosted` scale set has no egress to the LLM gateway: its base
      # NetworkPolicy allows DNS, public 443 with RFC1918 EXCLUDED,
      # traefik:8443 and apiserver:6443 — and the gateway is a ClusterIP on
      # :4000 inside 10.0.0.0/8. Jobs there fail HTTP 000, not 401, because
      # they never reach it.
      #
      # arc-runners/reverie has the matching egress+ingress pair and works.
      # Remove this override once cerebral-work-runners ships the same policy
      # (chart 0.1.5 lacks what unsigned-gg-runners 0.2.8 has).
      runner: reverie
