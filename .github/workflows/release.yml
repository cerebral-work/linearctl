name: Release

# release-please opens/maintains a Release PR from Conventional Commits. Merging
# it tags `v<x.y.z>` and creates a GitHub Release; that release then triggers the
# bun cross-compile matrix, which attaches SLSA-attested single binaries consumed
# by `mise use -g "github:cerebral-work/linearctl"`. See docs/decisions.md ADR-0001.

on:
  push:
    branches: [main]
  # Manual lever: GitHub occasionally drops a push event (observed 2026-07-11 —
  # the v0.7.0 release-PR merge produced NO event, so nothing tagged). Bare
  # dispatch re-drives release-please. `tag` drives the BUILD MATRIX against an
  # existing tag/release instead — the recovery for the 2026-07-11 case where
  # the integration token was refused on releases#create (grants identical to
  # prior green runs; user-token creates fine): mint the release by hand, then
  # dispatch with tag=vX.Y.Z to compile/attest/upload the binaries.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build+upload assets for (skips release-please)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Branch protection requires the CI check on every PR, but release-please
  # pushes with GITHUB_TOKEN, whose events never trigger workflows — so the
  # Release PR would sit permanently BLOCKED. This job MINTS the required
  # check: after release-please runs (on every main push), it finds any open
  # release-please PR, actually runs typecheck/test/build against its head
  # SHA, and posts a check-run with the exact required name via the Checks
  # API. No PAT, no new secrets; honest gate (red tests -> red check).
  gate-release-pr:
    name: Gate release PR
    needs: release-please
    if: always() && needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Find open release-please PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open             --json headRefName,headRefOid             -q '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefOid // empty')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          [ -n "$SHA" ] && echo "found release PR head $SHA" || echo "no open release PR"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.pr.outputs.sha != ''
        with:
          ref: ${{ steps.pr.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.pr.outputs.sha != ''
      - name: typecheck / test / compile against the PR head
        id: verify
        if: steps.pr.outputs.sha != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bun run typecheck && bun test && bun run build
      - name: Mint the required check on the PR head
        if: always() && steps.pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONC=$([ "${{ steps.verify.outcome }}" = "success" ] && echo success || echo failure)
          gh api "repos/$GITHUB_REPOSITORY/check-runs"             -f name='typecheck · test · compile-smoke'             -f head_sha='${{ steps.pr.outputs.sha }}'             -f status=completed -f conclusion="$CONC"             -f 'output[title]=Release-PR gate (minted by release.yml)'             -f 'output[summary]=Ran typecheck/test/build against the release PR head; bot pushes cannot trigger the pull_request workflow themselves.'

  # Sync the freshly-tagged release to Linear. Called here (not via `push: tags`
  # on linear-release.yml) because release-please tags with the default
  # GITHUB_TOKEN, which never fires tag-push workflows. `secrets: inherit` passes
  # LINEAR_ACCESS_KEY through; the called workflow self-skips when it's absent.
  # The sync is best-effort (reporting, not the deliverable): linear-release.yml
  # marks its action steps continue-on-error so a sync hiccup — e.g. a duplicate-
  # version collision — can't red this release run or block distribution.
  linear-release:
    name: Sync release to Linear
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linear-release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  build:
    name: Compile · attest · upload (${{ matrix.asset }})
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write # sigstore signing for attestation
      attestations: write # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-modern
            asset: linux_amd64
          - target: bun-linux-arm64
            asset: linux_arm64
          - target: bun-darwin-arm64
            asset: darwin_arm64
          - target: bun-darwin-x64
            asset: darwin_amd64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Manual drive builds the TAGGED code, not whatever main moved to.
          ref: ${{ inputs.tag || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.target }}
        run: |
          bun build ./src/index.ts --compile --minify \
            --target=${{ matrix.target }} --outfile linearctl

      - name: Archive (GoReleaser-style name for mise asset scoring)
        id: archive
        run: |
          VER="${{ needs.release-please.outputs.tag_name || inputs.tag }}"
          NAME="linearctl_${VER#v}_${{ matrix.asset }}.tar.gz"
          tar -czf "$NAME" linearctl
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.archive.outputs.name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name || inputs.tag }}" \
            "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.sha256" --clobber
