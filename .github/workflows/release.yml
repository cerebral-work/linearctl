name: Release

# release-please opens/maintains a Release PR from Conventional Commits. Merging
# it tags `v<x.y.z>` and creates a GitHub Release; that release then triggers the
# bun cross-compile matrix, which attaches SLSA-attested single binaries consumed
# by `mise use -g "github:cerebral-work/linearctl"`. See docs/decisions.md ADR-0001.

on:
  push:
    branches: [main]
  # Manual lever: GitHub occasionally drops a push event (observed 2026-07-11 —
  # the v0.7.0 release-PR merge produced NO event, so nothing tagged). Bare
  # dispatch re-drives release-please. `tag` drives the BUILD MATRIX against an
  # existing tag/release instead — the recovery for the 2026-07-11 case where
  # the integration token was refused on releases#create (grants identical to
  # prior green runs; user-token creates fine): mint the release by hand, then
  # dispatch with tag=vX.Y.Z to compile/attest/upload the binaries.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build+upload assets for (skips release-please)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    # The job's own GITHUB_TOKEN needs nothing beyond read: every write is made
    # with the release-please App token minted below. The enterprise policy does
    # not allow GitHub Actions to create or approve pull requests ("GitHub
    # Actions is not permitted to create or approve pull requests"), so a
    # GITHUB_TOKEN can update an existing release PR but never open a new one.
    # An App token can, and the PRs/tags it creates also trigger workflows.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Dedicated minimal App (Contents, Issues, Pull requests: write; installed
      # only on the repos that run release-please). Deliberately NOT the broad
      # `cerebral-work` App (RELEASE_BOT_*), whose key carries org-admin-level
      # permissions. The minted token is narrowed further to this repo and to
      # the three permissions release-please documents. A missing variable or
      # secret fails this step, so the job cannot fall back to GITHUB_TOKEN.
      - name: Mint a release-please App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          owner: cerebral-work
          repositories: linearctl
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Sync the freshly-tagged release to Linear. Called here (not via `push: tags`
  # on linear-release.yml) so it runs exactly once, in the same run that creates
  # the release; a tag trigger would also fire for the App-created tag and
  # double-run it. `secrets: inherit` passes LINEAR_ACCESS_KEY through; the
  # called workflow self-skips when it's absent.
  # The sync is best-effort (reporting, not the deliverable): linear-release.yml
  # marks its action steps continue-on-error so a sync hiccup — e.g. a duplicate-
  # version collision — can't red this release run or block distribution.
  linear-release:
    name: Sync release to Linear
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linear-release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  build-linux:
    name: Compile · attest · upload (${{ matrix.asset }})
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write # sigstore signing for attestation
      attestations: write # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-modern
            asset: linux_amd64
          - target: bun-linux-arm64
            asset: linux_arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Manual drive builds the TAGGED code, not whatever main moved to.
          ref: ${{ inputs.tag || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.target }}
        run: |
          bun build ./src/index.ts --compile --minify \
            --define 'process.env.DEV="false"' \
            --target=${{ matrix.target }} --outfile linearctl

      - name: Archive (GoReleaser-style name for mise asset scoring)
        id: archive
        run: |
          VER="${{ needs.release-please.outputs.tag_name || inputs.tag }}"
          NAME="linearctl_${VER#v}_${{ matrix.asset }}.tar.gz"
          tar -czf "$NAME" linearctl
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.archive.outputs.name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name || inputs.tag }}" \
            "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.sha256" --clobber

  # macOS builds: compile on macos-latest (bun cross-compile from Linux produces
  # Mach-O binaries, but codesign + notarize require macOS + notarytool).
  # DORMANT-UNTIL-KEYED: when APPLE_DEVELOPER_ID_APPLICATION is absent, builds
  # compile + upload UNSIGNED binaries (current behavior — Gatekeeper quarantine
  # workaround: xattr -d com.apple.quarantine). When the secret is present, the
  # binary is codesigned with a Developer ID Application certificate, notarized
  # via notarytool, and stapled. See CER-1150 / T15.
  build-darwin:
    name: Compile · sign · notarize (${{ matrix.asset }})
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: darwin_arm64
          - target: bun-darwin-x64
            asset: darwin_amd64
    env:
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEYCHAIN_PROFILE: linearctl-notary
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.target }}
        run: |
          bun build ./src/index.ts --compile --minify \
            --define 'process.env.DEV="false"' \
            --target=${{ matrix.target }} --outfile linearctl

      - name: Check signing readiness
        id: can_sign
        run: |
          if [ -n "${APPLE_DEVELOPER_ID_APPLICATION:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "signing enabled — binary will be codesigned + notarized + stapled"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple secrets not set — uploading UNSIGNED binary (Gatekeeper quarantine workaround: xattr -d com.apple.quarantine). See CER-1150."
          fi

      # Import the Developer ID Application certificate (base64 P12) into the
      # runner's keychain. The secret contains the P12; the password for it is
      # the keychain password (stored separately or derived). See CER-1150 setup.
      - name: Import signing certificate
        id: cert
        if: steps.can_sign.outputs.ready == 'true'
        run: |
          CERT_FILE=$(mktemp /tmp/developer-id.p12.XXXXXX)
          KEYCHAIN=signing.keychain-db
          RKPW=$(openssl rand -hex 32)
          echo "$RKPW" > /tmp/.keychain-pw

          # Create a temporary keychain
          security create-keychain -p "$RKPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$RKPW" "$KEYCHAIN"

          # Import the P12 certificate
          echo "${APPLE_DEVELOPER_ID_APPLICATION}" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -P "${APPLE_CERTIFICATE_PASSWORD:-$RKPW}" \
            -k "$KEYCHAIN" -T /usr/bin/codesign

          # Make the keychain available to codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          # Extract the Developer ID identity name for codesign
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

          rm -f "$CERT_FILE"

      - name: Codesign (Hardened Runtime)
        if: steps.can_sign.outputs.ready == 'true'
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          security unlock-keychain -p "$(cat /tmp/.keychain-pw)" "$KEYCHAIN"
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            linearctl
          codesign --verify --verbose=2 linearctl

      - name: Notarize (notarytool)
        if: steps.can_sign.outputs.ready == 'true'
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          security unlock-keychain -p "$(cat /tmp/.keychain-pw)" "$KEYCHAIN"

          # Store notarytool credentials in the keychain profile
          xcrun notarytool store-credentials "$APPLE_NOTARY_KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$KEYCHAIN" || true

          # Submit for notarization and wait
          xcrun notarytool submit linearctl \
            --keychain-profile "$APPLE_NOTARY_KEYCHAIN_PROFILE" \
            --wait

      - name: Staple notarization ticket
        if: steps.can_sign.outputs.ready == 'true'
        run: |
          xcrun stapler staple linearctl
          xcrun stapler validate linearctl

      - name: Archive (GoReleaser-style name for mise asset scoring)
        id: archive
        run: |
          VER="${{ needs.release-please.outputs.tag_name || inputs.tag }}"
          NAME="linearctl_${VER#v}_${{ matrix.asset }}.tar.gz"
          tar -czf "$NAME" linearctl
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.archive.outputs.name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name || inputs.tag }}" \
            "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.sha256" --clobber
