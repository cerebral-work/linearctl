name: Release

# release-please opens/maintains a Release PR from Conventional Commits. Merging
# it tags `v<x.y.z>` and creates a GitHub Release; that release then triggers the
# bun cross-compile matrix, which attaches SLSA-attested single binaries consumed
# by `mise use -g "github:cerebral-work/linearctl"`. See docs/decisions.md ADR-0001.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Sync the freshly-tagged release to Linear. Called here (not via `push: tags`
  # on linear-release.yml) because release-please tags with the default
  # GITHUB_TOKEN, which never fires tag-push workflows. `secrets: inherit` passes
  # LINEAR_ACCESS_KEY through; the called workflow self-skips when it's absent.
  linear-release:
    name: Sync release to Linear
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linear-release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  build:
    name: Compile · attest · upload (${{ matrix.asset }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write # sigstore signing for attestation
      attestations: write # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-modern
            asset: linux_amd64
          - target: bun-linux-arm64
            asset: linux_arm64
          - target: bun-darwin-arm64
            asset: darwin_arm64
          - target: bun-darwin-x64
            asset: darwin_amd64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.target }}
        run: |
          bun build ./src/index.ts --compile --minify \
            --target=${{ matrix.target }} --outfile linearctl

      - name: Archive (GoReleaser-style name for mise asset scoring)
        id: archive
        run: |
          VER="${{ needs.release-please.outputs.tag_name }}"
          NAME="linearctl_${VER#v}_${{ matrix.asset }}.tar.gz"
          tar -czf "$NAME" linearctl
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.archive.outputs.name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.sha256" --clobber
