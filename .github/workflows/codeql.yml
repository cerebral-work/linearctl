name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan: 06:00 UTC Mondays.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

# The analyzed code is identical for every event targeting the same ref; a
# concurrency group per-ref cancels superseded runs (mirrors ci.yml).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze · javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Initialize CodeQL for the repo's language. Build mode `none` — the
      # linearctl source is TypeScript consumed by `bun` (no separate build
      # step is needed for CodeQL to analyze the source files).
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
