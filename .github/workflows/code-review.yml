name: Code Review (GLM-5.2)

# Agent jury: automated code review on every PR using GLM-5.2 via the LiteLLM
# gateway. Posts a structured review comment + stamps a label
# (agent-jury-approved / agent-jury-needs-changes / agent-jury-changes-requested).
#
# Per-org runner: reverie-ug for unsigned-gg, reverie for cerebral-work.
# Both runners carry the baked image with tailnet access to the LiteLLM gateway.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: GLM-5.2 code review
    runs-on: ${{ github.repository_owner == 'cerebral-work' && 'reverie' || 'reverie-ug' }}
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gather PR diff + context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          PR_JSON=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""' | head -100)

          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD --unified=3 2>/dev/null || git diff ${{ github.event.pull_request.base.sha }}...HEAD --unified=3)
          DIFF_TRUNCATED=$(echo "$DIFF" | head -c 12000)
          DIFF_LINES=$(echo "$DIFF" | wc -l)
          FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "unknown")

          {
            echo "number=$PR_NUMBER"
            echo "title<<EOF"
            echo "$PR_TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "$PR_BODY"
            echo "EOF"
            echo "files<<EOF"
            echo "$FILES_CHANGED"
            echo "EOF"
            echo "diff_lines=$DIFF_LINES"
          } >> "$GITHUB_OUTPUT"

          echo "$DIFF_TRUNCATED" > /tmp/pr-diff.txt

      - name: Run GLM-5.2 review
        id: review
        env:
          LITELLM_URL: "${{ vars.AGENT_JURY_API_URL || 'http://llm.llm.svc.cluster.local:4000' }}"
          LITELLM_KEY: "${{ secrets.AGENT_JURY_API_KEY || '' }}"
          AGENT_JURY_MODEL: "${{ vars.AGENT_JURY_MODEL || 'glm-5.2' }}"
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          FILES_CHANGED: ${{ steps.pr.outputs.files }}
        run: |
          set -euo pipefail

          DIFF=$(cat /tmp/pr-diff.txt)

          HAS_RUST=$(echo "$FILES_CHANGED" | grep -c '\.rs$' || true)
          DIFF_LINES=$(echo "$DIFF" | wc -l)

          if [ "$HAS_RUST" -gt 0 ] && [ "$DIFF_LINES" -gt 50 ]; then
            JURY_MODEL="$AGENT_JURY_MODEL"
            MAX_TOKENS=1000000
          else
            JURY_MODEL="glm-5.2-fast"
            MAX_TOKENS=4096
          fi
          echo "Using model=$JURY_MODEL max_tokens=$MAX_TOKENS (rust=$HAS_RUST lines=$DIFF_LINES)" >&2

          REVIEW_PROMPT="Code review. Read the diff. Report only what you can verify from the code. No speculation, no hedging, no restating the diff.

          PR #${PR_NUMBER}: ${PR_TITLE}
          Files: ${FILES_CHANGED}

          \`\`\`diff
          ${DIFF}
          \`\`\`

          Identify: logic errors, panic paths on untrusted input, security holes, broken contracts, resource leaks. Cite the specific line or pattern. If you cannot ground a finding in the diff, do not report it.

          JSON only, no fences:
          {\"verdict\":\"approved\"|\"needs-changes\"|\"changes-requested\",\"confidence\":\"high\"|\"medium\"|\"low\",\"findings\":[{\"severity\":\"blocker\"|\"warning\",\"file\":\"path\",\"line\":<num|null>,\"issue\":\"<one sentence, the defect>\",\"suggestion\":\"<one sentence, the fix>\"}],\"summary\":\"<two sentences: what changed, what risks remain>\"}

          Trivial diffs (deps, fmt, docs): {\"verdict\":\"approved\",\"confidence\":\"high\",\"findings\":[],\"summary\":\"No logic changes.\"}"

          REQUEST_BODY=$(jq -nc \
            --arg model "$JURY_MODEL" \
            --arg prompt "$REVIEW_PROMPT" \
            --argjson max_tokens "$MAX_TOKENS" \
            '{model: $model, messages: [{role: "user", content: $prompt}], temperature: 0.2, max_tokens: $max_tokens}')

          CURL_ARGS=(-sf -m 300 -X POST -H "Content-Type: application/json")
          if [ -n "$LITELLM_KEY" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer $LITELLM_KEY")
          fi
          CURL_ARGS+=(-d "$REQUEST_BODY")

          RESPONSE=$(curl "${CURL_ARGS[@]}" "$LITELLM_URL/chat/completions" 2>&1) || {
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            echo "GLM review request failed: $RESPONSE" >&2
            exit 0
          }

          CONTENT=$(echo "$RESPONSE" | jq -r '
            .choices[0].message.content //
            .choices[0].message.reasoning_content //
            empty' 2>/dev/null)

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            echo "GLM-5.2 returned empty content. Raw response: $RESPONSE" >&2
            exit 0
          fi

          CLEAN=$(echo "$CONTENT" | sed 's/^```json//; s/^```//; s/```$//' | jq '.' 2>/dev/null)

          if [ -z "$CLEAN" ]; then
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            echo "GLM-5.2 response was not valid JSON: $CONTENT" >&2
            exit 0
          fi

          VERDICT=$(echo "$CLEAN" | jq -r '.verdict // "needs-changes"')
          CONFIDENCE=$(echo "$CLEAN" | jq -r '.confidence // "low"')
          SUMMARY=$(echo "$CLEAN" | jq -r '.summary // "No summary provided"')
          FINDINGS_COUNT=$(echo "$CLEAN" | jq '.findings | length')

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "confidence=$CONFIDENCE" >> "$GITHUB_OUTPUT"
          echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"
          echo "$CLEAN" > /tmp/jury-parsed.json

      - name: Post review comment + stamp label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          CONFIDENCE: ${{ steps.review.outputs.confidence }}
          FINDINGS_COUNT: ${{ steps.review.outputs.findings_count }}
          REVIEW_FAILED: ${{ steps.review.outputs.review_failed }}
          MODEL: ${{ vars.AGENT_JURY_MODEL || 'glm-5.2' }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          for lbl in agent-jury-approved agent-jury-needs-changes agent-jury-changes-requested; do
            curl -sf -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/issues/$PR_NUMBER/labels/$lbl" 2>/dev/null || true
          done

          if [ "$REVIEW_FAILED" = "true" ]; then
            LABEL="agent-jury-needs-changes"
            BODY="## 🤖 Agent Jury — Review Failed

            The GLM-5.2 review could not complete (gateway error or invalid response).
            Manual review required.

            | Field | Value |
            |---|---|
            | Model | \`${MODEL}\` |
            | Status | ⚠️ failed |
            "
          else
            JURY_JSON=$(cat /tmp/jury-parsed.json)

            case "$VERDICT" in
              approved)         LABEL="agent-jury-approved"; EMOJI="✅" ;;
              needs-changes)    LABEL="agent-jury-needs-changes"; EMOJI="⚠️" ;;
              changes-requested) LABEL="agent-jury-changes-requested"; EMOJI="🔴" ;;
              *)                LABEL="agent-jury-needs-changes"; EMOJI="⚠️" ;;
            esac

            FINDINGS_MD=$(echo "$JURY_JSON" | jq -r '
              .findings // [] |
              if length == 0 then
                "_No findings — the diff looks clean._"
              else
                "| Severity | File | Line | Issue | Suggestion |\n|---|---|---|---|---|\n" +
                ([.[] | "| \(.severity // "?") | \(.file // "?") | \(.line // "—") | \(.issue // "") | \(.suggestion // "") |"] | join("\n"))
              end
            ')

            SUMMARY=$(echo "$JURY_JSON" | jq -r '.summary // "No summary provided"')

            BODY="## 🤖 Agent Jury — ${EMOJI} ${VERDICT}

            | Field | Value |
            |---|---|
            | Model | \`${MODEL}\` |
            | Verdict | **${VERDICT}** |
            | Confidence | ${CONFIDENCE} |
            | Findings | ${FINDINGS_COUNT} |

            ### Summary
            ${SUMMARY}

            ### Findings
            ${FINDINGS_MD}

            ---
            _Automated review by GLM-5.2 via LiteLLM gateway. Advisory — a human makes the final call._
            "
          fi

          echo "$(jq -nc --arg b "$BODY" '{body: $b}')" | \
            curl -sf -X POST -H "$AUTH" -H "$ACCEPT" -d @- \
            "$API/issues/$PR_NUMBER/comments" 2>/dev/null || true

          curl -sf -X POST -H "$AUTH" -H "$ACCEPT" \
            -d "{\"labels\":[\"$LABEL\"]}" \
            "$API/issues/$PR_NUMBER/labels" 2>/dev/null || true
          echo "Agent jury verdict: $VERDICT (label: $LABEL)"

      - name: Auto-merge on approval
        if: steps.review.outputs.verdict == 'approved' && steps.review.outputs.review_failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          PR_DATA=$(curl -sf -H "$AUTH" -H "$ACCEPT" "$API/pulls/$PR_NUMBER")
          MERGE_STATE_STATUS=$(echo "$PR_DATA" | jq -r '.mergeable_state // "unknown"')

          echo "PR merge_state: $MERGE_STATE_STATUS"

          if [ "$MERGE_STATE_STATUS" = "clean" ]; then
            echo "All checks pass — auto-merging (squash)..."
            curl -sf -X PUT -H "$AUTH" -H "$ACCEPT" \
              -d '{"merge_method":"squash"}' \
              "$API/pulls/$PR_NUMBER/merge" 2>&1 || {
              echo "Auto-merge failed. Skipping."
            }
          else
            echo "Merge state is '$MERGE_STATE_STATUS' — not auto-merging."
          fi
