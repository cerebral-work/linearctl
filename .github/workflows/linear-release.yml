name: Linear Release (prod)

# PROD pipeline — released versions only. Syncs each tagged linearctl release to
# its Linear "linearctl" release pipeline (Settings → Releases), scanning the
# commit range for issue refs (CER-NNN / TOD-NNN) + PR numbers, then marking the
# release complete.
#
# CALLED, NOT TAG-TRIGGERED: release-please creates the tag with the default
# GITHUB_TOKEN, and GitHub by design does NOT fire `push: tags` workflows from
# token-created events — a tag trigger here would silently never run. So this is
# a reusable workflow invoked by release.yml in the same run that creates the
# release (release_created == true). workflow_dispatch stays for manual re-syncs.
#
# DORMANT-UNTIL-KEYED: no-op-safe skip when LINEAR_ACCESS_KEY is absent, so it
# never red-X's a release before the operator provisions the pipeline + key.
# Activate: create the `linearctl` pipeline in Linear → add repo secret
# LINEAR_ACCESS_KEY (its access key; store in 1Password vault `cloud`).

on:
  workflow_call:
    inputs:
      version:
        description: "Tag/version to sync, e.g. v0.2.0"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/version to (re)sync, e.g. v0.2.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  linear-release:
    name: Sync release to Linear
    runs-on: ubuntu-latest
    steps:
      - name: Check for access key
        id: gate
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
        run: |
          if [ -z "${LINEAR_ACCESS_KEY:-}" ]; then
            echo "::warning::LINEAR_ACCESS_KEY not set — skipping Linear release sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # full history — the CLI scans commits to the prior release

      - name: Resolve version
        id: ver
        if: steps.gate.outputs.enabled == 'true'
        env:
          RAW: ${{ inputs.version }}
        run: echo "version=${RAW}" >> "$GITHUB_OUTPUT"

      # Best-effort: the sync is release *reporting*, not the deliverable. A
      # failure (e.g. a duplicate-version collision in the pipeline) must not red
      # the caller's release run. continue-on-error lives here because a reusable-
      # workflow caller job can't carry it.
      - uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f # v0
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}

      # Tag-driven (release-please) → sync THEN complete, per the linear-release
      # README's tag-driven guidance (sync alone leaves the release in-progress).
      - uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f # v0
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.ver.outputs.version }}
