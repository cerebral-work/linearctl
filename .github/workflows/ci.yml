name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · compile-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (≥ v2.2.0 — Node 20 left the runners 2026-06-02)
        with:
          bun-version: 1.3.14
        # setup-bun v2 caches ~/.bun/install/cache automatically keyed on
        # bun.lock hash — no explicit cache step needed.

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          # Enables the read-only live-API contract tests (test/live-contract.test.ts);
          # they self-skip when the secret is absent (e.g. forks).
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun test

      - name: Verify live-contract tests ran (not skipped)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::warning::LINEAR_API_KEY secret is not set — live-contract tests are silently skipping on every CI run."
            echo "::warning::The read-only contract tests verify the GraphQL schema hasn't drifted. Without them, schema changes surface as runtime surprises."
            echo "::warning::To fix: add the LINEAR_API_KEY secret to the repo (Settings → Secrets → Actions)."
            exit 1
          fi
          # Re-run just the live-contract tests with verbose output to confirm they execute (not skip)
          OUTPUT=$(bun test test/live-contract.test.ts 2>&1)
          echo "$OUTPUT"
          # If the tests skipped, bun reports 0 pass — that's a CI gate failure
          if echo "$OUTPUT" | grep -q "0 pass"; then
            echo "::error::Live-contract tests skipped despite LINEAR_API_KEY being set — check test.skipIf logic."
            exit 1
          fi

      # Compile + run the real binary so a compile or module-load/bundling failure
      # is caught at PR time (the @linear/sdk import executes at startup). The SDK
      # client can't trip bun#11785 (no schema realm checks), so that is not what
      # this guards — see docs/decisions.md ADR-0001.
      - name: Compile smoke
        run: |
          bun run build
          ./dist/linearctl --version
