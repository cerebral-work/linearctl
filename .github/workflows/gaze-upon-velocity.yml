name: gaze-upon velocity

# Auto-renders the gaze-upon project roadmap from live Linear data on a twice-
# daily schedule and on manual dispatch. The rendered roadmap (milestone
# progress bars, issue counts, 7-day activity) is committed back to
# roadmap-gaze-upon.md — a living velocity artifact that flexes throughput
# without any external posting.
#
# DORMANT-UNTIL-KEYED: no-op-safe skip when LINEAR_API_KEY is absent. The
# workflow runs but exits green without committing, so it never red-X's.

on:
  schedule:
    # 09:00 and 21:00 UTC — twice daily, avoids the top-of-hour API rush.
    - cron: "0 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit + push the auto-render branch
  pull-requests: write # create + merge the auto-render PR

concurrency:
  group: gaze-upon-velocity
  cancel-in-progress: true

jobs:
  render:
    name: Render velocity roadmap
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: gate
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::warning::LINEAR_API_KEY not set — skipping velocity render."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          bun-version: 1.3.14

      - name: Install + build
        if: steps.gate.outputs.enabled == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Render roadmap from live Linear data
        if: steps.gate.outputs.enabled == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: .github/scripts/render-roadmap.sh gaze-upon roadmap-gaze-upon.md

      - name: Commit if changed
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if git diff --quiet roadmap-gaze-upon.md; then
            echo "No changes — roadmap already current."
            exit 0
          fi

          # main is branch-protected (requires CI checks). Push to an auto-branch,
          # open a PR, and admin-merge it — keeps the trunk green without bypassing
          # the protection rules.
          BRANCH="auto-render/gaze-upon-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add roadmap-gaze-upon.md
          git commit -m "docs(gaze-upon): auto-render velocity roadmap [skip ci]"
          git push origin "$BRANCH"

          # Create PR and admin-merge (docs-only, no code changes).
          PR_URL=$(gh pr create \
            --title "docs(gaze-upon): auto-render velocity roadmap" \
            --body "Re-rendered from live Linear data by gaze-upon-velocity.yml run #${GITHUB_RUN_NUMBER}. Milestone progress, 7-day activity, issue counts. Auto-generated; docs-only." \
            --base main \
            --head "$BRANCH")
          PR_NUM=$(basename "$PR_URL")
          gh pr merge "$PR_NUM" --merge --admin --subject "docs(gaze-upon): auto-render velocity roadmap (#$PR_NUM)"
          echo "Merged $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
