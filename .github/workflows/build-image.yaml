name: Build image

# Image build and chart publish for the in-cluster linearctl operator, with
# stock actions, in this repo:
#   1. build the Dockerfile with BuildKit and push to Harbor;
#   2. block on a Trivy HIGH/CRITICAL scan of the pushed digest;
#   3. sign that digest with the estate cosign key (the key Kyverno's
#      verify-image-signatures trusts) and verify the signature;
#   4. publish deploy/chart to Harbor OCI, once per chart version.
#
# This replaces the cross-repo dispatch to unsigned-paas
# build-linearctl-image.yaml (operator ruling 2026-10-07, CER-2647).
#
# Secrets: HARBOR_PUSH_USERNAME/PASSWORD (platform project push robot),
# HARBOR_HELM_PUSH_USERNAME/PASSWORD (helm-charts push robot),
# COSIGN_PRIVATE_KEY/COSIGN_PASSWORD (estate signing key).
# This repo is PUBLIC. The workflow never runs on pull_request, so the secrets
# are never available in a context a fork can influence.
#
# Size: the compiled binary is ~37 MB gzipped, under Cloudflare's ~100 MB body
# cap on harbor.unsigned.gg (OPS-810). A layer above the cap gets HTTP 413.
#
# Publishing is not deploying: the ArgoCD pin bump in unsigned-paas gitops/ is
# a separate, operator-gated PR.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "examples/**"
      - ".linearctl/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "Dockerfile"
      - "deploy/chart/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-linearctl-image
  cancel-in-progress: false

env:
  REGISTRY: harbor.unsigned.gg
  IMAGE: harbor.unsigned.gg/platform/linearctl
  CHART_REPO: oci://harbor.unsigned.gg/helm-charts

jobs:
  build:
    name: Build, scan, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve tag + chart version
        id: params
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          chart_version="$(awk '/^version:/{gsub(/["'"'"']/,"",$2); print $2; exit}' deploy/chart/Chart.yaml)"
          [ -n "${chart_version}" ] || { echo "::error::failed to read version from deploy/chart/Chart.yaml"; exit 1; }
          {
            echo "tag=git-${short_sha}"
            echo "chart_version=${chart_version}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_PUSH_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.params.outputs.tag }}
          # One plain image manifest, the same shape the in-cluster build pushed.
          provenance: false
          sbom: false

      - name: Trivy scan (blocking, HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_PUSH_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PUSH_PASSWORD }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify by digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          # --tlog-upload=false keeps private-registry refs out of the public
          # Rekor log (estate rule), so verify with --insecure-ignore-tlog.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${ref}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "${RUNNER_TEMP}/cosign.pub"
          cosign verify --key "${RUNNER_TEMP}/cosign.pub" --insecure-ignore-tlog "${ref}" > /dev/null
          echo "Signed and verified ${ref}"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Publish chart (once per version)
        env:
          HELM_PUSH_USERNAME: ${{ secrets.HARBOR_HELM_PUSH_USERNAME }}
          HELM_PUSH_PASSWORD: ${{ secrets.HARBOR_HELM_PUSH_PASSWORD }}
          CHART_VERSION: ${{ steps.params.outputs.chart_version }}
        run: |
          set -euo pipefail
          printf '%s' "${HELM_PUSH_PASSWORD}" \
            | helm registry login "${REGISTRY}" --username "${HELM_PUSH_USERNAME}" --password-stdin
          # A chart version is published once. Rebuilds of the same version do
          # not overwrite it; bump deploy/chart/Chart.yaml to publish a change.
          if helm show chart "${CHART_REPO}/linearctl" --version "${CHART_VERSION}" > /dev/null 2>&1; then
            echo "::notice::chart linearctl ${CHART_VERSION} is already in Harbor; not republished"
            exit 0
          fi
          helm package deploy/chart -d "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/linearctl-${CHART_VERSION}.tgz" "${CHART_REPO}"

      - name: Summary
        env:
          TAG: ${{ steps.params.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHART_VERSION: ${{ steps.params.outputs.chart_version }}
        run: |
          {
            echo "### linearctl image"
            echo "- image: \`${IMAGE}:${TAG}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- chart: \`${CHART_REPO}/linearctl:${CHART_VERSION}\`"
            echo
            echo "Publishing is not deploying. The ArgoCD pin bump is a separate, operator-gated PR."
          } >> "${GITHUB_STEP_SUMMARY}"
